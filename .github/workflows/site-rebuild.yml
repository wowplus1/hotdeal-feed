# 작업 PC 가 카톡 발송 기록(deals.json)이나 웹 전용 딜(web.json)을 올리면
# 검색 사이트(wowplus1.github.io)에 「다시 만들어라」 신호를 보낸다. (2026-10-19)
# 깃허브 예약 실행이 안 돌아서 만든 것. 토큰은 SITE_TOKEN 비밀값 — 그 저장소의 Actions 실행 권한만 있다.
name: site-rebuild
on:
  push:
    branches: [main]
    paths: ['deals.json', 'web.json']
  workflow_dispatch:   # 손으로 시험할 때
jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - env:
          T: ${{ secrets.SITE_TOKEN }}
        run: |
          if [ -z "$T" ]; then echo "SITE_TOKEN 이 없어 건너뜀"; exit 0; fi
          curl -fsS -X POST \
            -H "Authorization: Bearer $T" -H "Accept: application/vnd.github+json" \
            https://api.github.com/repos/wowplus1/wowplus1.github.io/actions/workflows/build.yml/dispatches \
            -d '{"ref":"main"}'
          echo "사이트 다시 만들기 요청함"
